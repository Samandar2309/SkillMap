openapi: 3.0.3
info:
  title: SkillMap AI API
  version: v1
  description: AI-based student development platform API
paths:
  /api/v1/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticate user and return JWT tokens.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: Retrieve authenticated user's profile.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: accounts_register_create
      description: Register new user with email and password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/accounts/verify-email/:
    get:
      operationId: accounts_verify_email_retrieve
      description: Verify user email via token.
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
    post:
      operationId: accounts_verify_email_create
      description: Verify user email via token.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/ai/generate/:
    post:
      operationId: ai_generate_create
      description: |-
        Queue roadmap generation task.

        Returns:
            202 Accepted with task_id for status polling
            503 Service Unavailable if Celery broker unreachable
      tags:
      - ai
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapTaskResponse'
          description: ''
  /api/v1/profiles/me/:
    get:
      operationId: profiles_me_retrieve
      description: Retrieve or update the authenticated user's profile.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: profiles_me_update
      description: Retrieve or update the authenticated user's profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_me_partial_update
      description: Retrieve or update the authenticated user's profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/profiles/onboard/:
    put:
      operationId: profiles_onboard_update
      description: Complete onboarding for the authenticated user's existing profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_onboard_partial_update
      description: Complete onboarding for the authenticated user's existing profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOnboardingRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/progress/leaderboard/:
    get:
      operationId: progress_leaderboard_list
      description: Returns top users ranked by gamification points.
      tags:
      - progress
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
          description: ''
  /api/v1/progress/my-stats/:
    get:
      operationId: progress_my_stats_retrieve
      description: Returns user gamification counters and roadmap completion analytics.
      tags:
      - progress
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
          description: ''
  /api/v1/recommendations/my/:
    get:
      operationId: recommendations_my_retrieve
      description: |-
        Get personalized recommendations.

        Returns:
            200 OK with count and results list
            400 Bad Request if user profile missing
      tags:
      - recommendations
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
          description: ''
  /api/v1/roadmaps/me/:
    get:
      operationId: roadmaps_me_retrieve
      description: Returns the current user's roadmap with nested phases and tasks.
      tags:
      - roadmaps
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roadmap'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapError'
          description: ''
  /api/v1/roadmaps/tasks/{id}/:
    patch:
      operationId: roadmaps_tasks_partial_update
      description: Allows users to patch completion state of their own roadmap tasks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - roadmaps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapError'
          description: ''
  /api/v1/tests/questions/:
    get:
      operationId: tests_questions_list
      description: Returns all active aptitude questions with their choices.
      tags:
      - tests
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
          description: ''
  /api/v1/tests/submit/:
    post:
      operationId: tests_submit_create
      description: Creates a test attempt and stores selected answers in one transaction.
      tags:
      - tests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestSubmitRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSubmitResponse'
          description: ''
components:
  schemas:
    AnswerItemRequest:
      type: object
      description: One submitted answer entry for a question.
      properties:
        question_id:
          type: integer
          minimum: 1
          description: ID of the question being answered.
        choice_id:
          type: integer
          minimum: 1
          description: ID of the chosen answer option.
      required:
      - choice_id
      - question_id
    BlankEnum:
      enum:
      - ''
    Choice:
      type: object
      description: Public choice representation without score details.
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          title: Choice text
          description: Displayed answer choice text.
      required:
      - id
      - text
    DashboardStats:
      type: object
      description: Serializer for dashboard analytics payload.
      properties:
        progress:
          allOf:
          - $ref: '#/components/schemas/UserProgress'
          readOnly: true
          description: Gamification counters for the authenticated user.
        roadmap_completion_percentage:
          type: number
          format: double
          readOnly: true
          description: Percentage of roadmap tasks completed.
        completed_tasks_count:
          type: integer
          readOnly: true
          description: Count of completed tasks in the roadmap.
        total_tasks_count:
          type: integer
          readOnly: true
          description: Total count of tasks in the roadmap.
      required:
      - completed_tasks_count
      - progress
      - roadmap_completion_percentage
      - total_tasks_count
    DetailResponse:
      type: object
      description: Generic detail response serializer.
      properties:
        detail:
          type: string
          description: Human-readable status or error message.
      required:
      - detail
    EmailVerificationRequest:
      type: object
      description: Serializer for email verification token validation.
      properties:
        uid:
          type: string
          minLength: 1
          description: Base64-encoded user identifier from the verification link.
        token:
          type: string
          minLength: 1
          description: One-time verification token from the verification link.
      required:
      - token
      - uid
    EnglishLevelEnum:
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      - C2
      type: string
      description: |-
        * `A1` - A1
        * `A2` - A2
        * `B1` - B1
        * `B2` - B2
        * `C1` - C1
        * `C2` - C2
    LeaderboardEntry:
      type: object
      description: Serializer for top user rankings.
      properties:
        email:
          type: string
          format: email
          readOnly: true
          description: User email used as leaderboard identifier.
        total_points:
          type: integer
          description: Total earned points.
        current_streak:
          type: integer
          description: Current activity streak.
      required:
      - current_streak
      - email
      - total_points
    LoginRequest:
      type: object
      description: Serializer for email/password login.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address associated with the user account.
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Account password.
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: Serializer for login response payload.
      properties:
        refresh:
          type: string
        access:
          type: string
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - refresh
      - user
    OnboardingRequest:
      type: object
      description: Serializer for completing onboarding for the current user.
      properties:
        direction:
          type: string
          minLength: 1
          title: Career direction
          description: Choose the target career direction.
        english_level:
          allOf:
          - $ref: '#/components/schemas/EnglishLevelEnum'
          description: |-
            Choose the user's current English level.

            * `A1` - A1
            * `A2` - A2
            * `B1` - B1
            * `B2` - B2
            * `C1` - C1
            * `C2` - C2
        current_goal:
          type: string
          minLength: 1
          description: Describe the immediate learning goal.
      required:
      - current_goal
      - direction
      - english_level
    PatchedOnboardingRequest:
      type: object
      description: Serializer for completing onboarding for the current user.
      properties:
        direction:
          type: string
          minLength: 1
          title: Career direction
          description: Choose the target career direction.
        english_level:
          allOf:
          - $ref: '#/components/schemas/EnglishLevelEnum'
          description: |-
            Choose the user's current English level.

            * `A1` - A1
            * `A2` - A2
            * `B1` - B1
            * `B2` - B2
            * `C1` - C1
            * `C2` - C2
        current_goal:
          type: string
          minLength: 1
          description: Describe the immediate learning goal.
    PatchedProfileRequest:
      type: object
      description: Serializer for reading and partially updating a user's profile.
      properties:
        direction:
          type: string
          title: Career direction
          description: Target career direction such as backend, frontend, or data
            science.
        english_level:
          description: |-
            Current English level using CEFR scale.

            * `A1` - A1
            * `A2` - A2
            * `B1` - B1
            * `B2` - B2
            * `C1` - C1
            * `C2` - C2
          oneOf:
          - $ref: '#/components/schemas/EnglishLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        current_goal:
          type: string
          description: User's current learning or career goal.
    PatchedTaskUpdateRequest:
      type: object
      description: Restricted serializer for task completion updates.
      properties:
        is_completed:
          type: boolean
          title: Completed
          description: Mark the task as completed or not completed.
    Phase:
      type: object
      description: Nested phase serializer with tasks.
      properties:
        id:
          type: integer
          readOnly: true
        roadmap:
          type: integer
          readOnly: true
        title:
          type: string
          title: Phase title
          description: Name of the phase.
        order:
          type: integer
          title: Phase order
          description: Ordering of the phase in the roadmap.
        is_completed:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          readOnly: true
      required:
      - id
      - order
      - roadmap
      - tasks
      - title
    Profile:
      type: object
      description: Serializer for reading and partially updating a user's profile.
      properties:
        id:
          type: integer
          readOnly: true
        direction:
          type: string
          title: Career direction
          description: Target career direction such as backend, frontend, or data
            science.
        english_level:
          description: |-
            Current English level using CEFR scale.

            * `A1` - A1
            * `A2` - A2
            * `B1` - B1
            * `B2` - B2
            * `C1` - C1
            * `C2` - C2
          oneOf:
          - $ref: '#/components/schemas/EnglishLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        current_goal:
          type: string
          description: User's current learning or career goal.
        is_onboarded:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - is_onboarded
      - updated_at
      - user
    ProfileRequest:
      type: object
      description: Serializer for reading and partially updating a user's profile.
      properties:
        direction:
          type: string
          title: Career direction
          description: Target career direction such as backend, frontend, or data
            science.
        english_level:
          description: |-
            Current English level using CEFR scale.

            * `A1` - A1
            * `A2` - A2
            * `B1` - B1
            * `B2` - B2
            * `C1` - C1
            * `C2` - C2
          oneOf:
          - $ref: '#/components/schemas/EnglishLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        current_goal:
          type: string
          description: User's current learning or career goal.
    Question:
      type: object
      description: Question payload used by the user-facing test API.
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          title: Question text
          description: Question text shown to the user.
        skill_category:
          type: string
          description: Category used to group questions in the aptitude test.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          readOnly: true
      required:
      - choices
      - id
      - skill_category
      - text
    RecommendationItem:
      type: object
      description: Serializes a single recommendation resource.
      properties:
        direction:
          type: string
          description: Target career direction.
        min_english_level:
          type: string
          title: Minimum English level
          description: Minimum CEFR level compatible with this resource.
        max_english_level:
          type: string
          title: Maximum English level
          description: Maximum CEFR level compatible with this resource.
        title:
          type: string
          description: Resource title.
        description:
          type: string
          description: Short explanation of the resource.
        url:
          type: string
          format: uri
          description: Resource URL.
        resource_type:
          type: string
          description: Type of resource such as course or article.
        priority:
          type: integer
          description: Lower value means higher priority.
      required:
      - description
      - direction
      - max_english_level
      - min_english_level
      - priority
      - resource_type
      - title
      - url
    RecommendationListResponse:
      type: object
      description: Serialized pageless response for recommendation endpoint.
      properties:
        count:
          type: integer
          description: Number of recommended resources.
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
          description: List of recommended resources.
      required:
      - count
      - results
    RegisterRequest:
      type: object
      description: Serializer for user registration with email and password.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address used to create and later sign in to the account.
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Choose a strong password for the new account.
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          title: Confirm password
          description: Repeat the password to confirm registration.
      required:
      - email
      - password
      - password_confirm
    RegisterResponse:
      type: object
      description: Serializer for registration success response.
      properties:
        message:
          type: string
          description: Human-readable registration result.
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - message
      - user
    Roadmap:
      type: object
      description: Roadmap serializer with nested phases and tasks.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          title: Roadmap title
          description: Title of the generated roadmap.
        estimated_months:
          type: integer
          description: Approximate number of months needed to complete the roadmap.
        is_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        phases:
          type: array
          items:
            $ref: '#/components/schemas/Phase'
          readOnly: true
      required:
      - created_at
      - estimated_months
      - id
      - phases
      - title
      - user
    RoadmapError:
      type: object
      description: Error response serializer for roadmap endpoints.
      properties:
        detail:
          type: string
          description: Human readable error message.
        code:
          type: string
          title: Error code
          description: Machine-readable error code when available.
      required:
      - detail
    RoadmapTaskResponse:
      type: object
      description: Async task response returned when roadmap generation is queued.
      properties:
        task_id:
          type: string
          description: Celery task identifier for polling.
        status:
          type: string
          description: Current queue status, usually queued.
      required:
      - status
      - task_id
    Task:
      type: object
      description: Task serializer for nested roadmap reads.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Task title
          description: Short title for the task.
        description:
          type: string
          title: Task description
          description: Detailed explanation of what the learner should do.
        resource_link:
          type: string
          format: uri
          description: Optional URL to a learning resource for this task.
        is_completed:
          type: boolean
          readOnly: true
        phase:
          type: integer
      required:
      - id
      - is_completed
      - phase
      - title
    TestSubmitRequest:
      type: object
      description: Write-only serializer used to submit completed test answers.
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItemRequest'
          writeOnly: true
          description: List of answers provided by the user.
      required:
      - answers
    TestSubmitResponse:
      type: object
      description: Response returned after test submission.
      properties:
        attempt_id:
          type: integer
          description: Created test attempt identifier.
        total_score:
          type: integer
          description: Calculated score for the submitted answers.
      required:
      - attempt_id
      - total_score
    User:
      type: object
      description: Read-only user profile serializer.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_verified
    UserProgress:
      type: object
      description: Serializer for user gamification counters.
      properties:
        total_points:
          type: integer
          description: Total gamification points earned.
        current_streak:
          type: integer
          description: Current consecutive activity streak.
        longest_streak:
          type: integer
